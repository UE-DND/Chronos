  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.3 || 1.0.0 || 1.1.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.3.3 || 1.0.0 || 1.1.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.3.3 || 1.0.0 || 1.1.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.3.3 || 1.0.0 || 1.1.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.3 || 1.0.0 || 1.1.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.3.3 || 1.0.0 || 1.1.0'
  - vite-plus@0.3.3 || 1.0.0 || 1.1.0
overrides:
