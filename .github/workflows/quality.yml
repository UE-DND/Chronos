name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Run code check and linter
        run: vp run check
      - name: Run test suite
        run: vp run test
      - name: Verify official plugins
        run: vp run verify:official-plugins

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CQUT
            command: vp run build:cqut
            license_path: apps/web/.vercel/output/static/licenses/third-party.json
          - name: CQUT offline
            command: vp run build:cqut-offline
            license_path: apps/web/.vercel/output/static/licenses/third-party.json
          - name: Default
            command: vp run build:default
            license_path: apps/web/.vercel/output/static/licenses/third-party.json
          - name: Mobile
            command: vp run build:mobile
            license_path: apps/web/build/licenses/third-party.json
          - name: GitHub Pages
            command: vp run build:pages
            license_path: apps/web/build/licenses/third-party.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build ${{ matrix.name }} distribution
        run: ${{ matrix.command }}
      - name: Verify third-party license artifact
        run: test -s "${{ matrix.license_path }}"

  complete:
    name: CI complete
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks passed
        run: 'true'
