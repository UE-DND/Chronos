name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Run code check, Svelte check, and linter
        run: vp run check
      - name: Run test suite
        run: vp run test
      - name: Verify official plugins
        run: vp run verify:official-plugins

  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CQUT
            command: vp run build:cqut
            license_path: apps/web/.vercel/output/static/licenses/third-party.json
          - name: CQUT offline
            command: vp run build:cqut-offline
            license_path: apps/web/.vercel/output/static/licenses/third-party.json
          - name: Default
            command: vp run build:default
            license_path: apps/web/.vercel/output/static/licenses/third-party.json
          - name: Mobile
            command: vp run build:mobile
            license_path: apps/web/build/licenses/third-party.json
          - name: GitHub Pages
            command: vp run build:pages
            license_path: apps/web/build/licenses/third-party.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build ${{ matrix.name }} distribution
        run: ${{ matrix.command }}
      - name: Verify third-party license artifact
        run: test -s "${{ matrix.license_path }}"

  browser-build:
    name: Build PWA regression fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build production PWA regression fixtures
        run: vp run build:browser
      - name: Upload regression fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-regression-builds
          path: |
            dist/e2e/old
            dist/e2e/new
            dist/e2e/isolated
            dist/e2e/scenario.payload
          include-hidden-files: true
          compression-level: 1
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  browser:
    name: PWA browser regression (${{ matrix.shard }}/4)
    needs: browser-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Download regression fixtures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pwa-regression-builds
          path: dist/e2e
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vp exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: vp exec playwright install-deps chromium
      - name: Run production PWA regression
        run: vp exec playwright test --shard=${{ matrix.shard }}/4
      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-regression-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            dist/e2e/report
            dist/e2e/results
          if-no-files-found: ignore

  complete:
    name: CI complete
    if: always()
    needs: [checks, build, browser-build, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks passed
        env:
          CHECKS: ${{ needs.checks.result }}
          BUILDS: ${{ needs.build.result }}
          FIXTURES: ${{ needs.browser-build.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          [[ "$CHECKS" == success && "$BUILDS" == success && "$FIXTURES" == success && "$BROWSER" == success ]]
