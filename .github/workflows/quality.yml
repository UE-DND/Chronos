name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-changes:
    name: Select native validation
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.paths.outputs.ios }}
      instrumentation: ${{ steps.paths.outputs.instrumentation }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Select native paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'ios=true' >> "$GITHUB_OUTPUT"
            echo 'instrumentation=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/native-paths.txt"
          COMMON='^(pnpm-lock\.yaml$|package\.json$|\.node-version$|\.github/workflows/(quality|release|ios-release)\.yml$|apps/mobile/(src/|scripts/|capacitor\.config\.ts$|package\.json$))'
          IOS="${COMMON}|^apps/mobile/ios/"
          ANDROID="${COMMON}|^apps/mobile/android/"
          if grep -Eq "$IOS" "$RUNNER_TEMP/native-paths.txt"; then
            echo 'ios=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ios=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq "$ANDROID" "$RUNNER_TEMP/native-paths.txt"; then
            echo 'instrumentation=true' >> "$GITHUB_OUTPUT"
          else
            echo 'instrumentation=false' >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: '.node-version'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Run code check, Svelte check, and linter
        run: vp run check
      - name: Run test suite
        run: vp run test
      - name: Verify official plugins
        run: vp run verify:official-plugins

  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CQUT
            command: vp run build:cloudflare -- --distribution cqut
            license_path: apps/web/.svelte-kit/cloudflare/licenses/third-party.json
          - name: CQUT offline
            command: vp run build:cloudflare -- --distribution cqut-offline
            license_path: apps/web/.svelte-kit/cloudflare/licenses/third-party.json
          - name: Default
            command: vp run build:cloudflare
            license_path: apps/web/.svelte-kit/cloudflare/licenses/third-party.json
          - name: Mobile
            command: vp run build:mobile
            license_path: apps/web/build/licenses/third-party.json
          - name: GitHub Pages
            command: vp run build:pages
            license_path: apps/web/build/licenses/third-party.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: '.node-version'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build ${{ matrix.name }} distribution
        run: ${{ matrix.command }}
      - name: Verify third-party license artifact
        run: test -s "${{ matrix.license_path }}"

  android:
    name: Android native verification
    needs: native-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: '.node-version'
          cache: true
          run-install: false
      - name: Setup Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/**/*.gradle*
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
            apps/mobile/android/gradle.properties
            pnpm-lock.yaml
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build and sync mobile web assets
        run: vp run mobile:build
      - name: Run native unit tests and compile Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon --build-cache :app:testDebugUnitTest :app:assembleDebug
      - name: Install Android emulator
        if: needs.native-changes.outputs.instrumentation == 'true'
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/chronos-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sdkmanager "emulator" "system-images;android-36;google_apis;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name chronos-ci --package "system-images;android-36;google_apis;x86_64" --force
          test -f "$ANDROID_AVD_HOME/chronos-ci.ini"
          sudo chmod 666 /dev/kvm
      - name: Run native instrumentation regression
        if: needs.native-changes.outputs.instrumentation == 'true'
        timeout-minutes: 15
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" -avd chronos-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" || true' EXIT
          timeout 180s adb wait-for-device
          for attempt in $(seq 1 120); do
            [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew --no-daemon --build-cache :app:connectedDebugAndroidTest
      - name: Upload native failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-failure
          path: |
            apps/mobile/android/app/build/reports/tests
            apps/mobile/android/app/build/reports/androidTests
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore

  ios:
    name: iOS unsigned native compilation
    needs: native-changes
    if: needs.native-changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: '.node-version'
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build and sync mobile web assets
        run: vp run mobile:build
      - name: Compile unsigned iOS app
        run: |
          xcodebuild -quiet \
            -project apps/mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/chronos-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  browser-build:
    name: Build PWA regression fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: '.node-version'
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build production PWA regression fixtures
        run: vp run build:browser
      - name: Upload regression fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-regression-builds
          path: |
            dist/e2e/old
            dist/e2e/new
            dist/e2e/isolated
            dist/e2e/scenario.payload
          include-hidden-files: true
          compression-level: 1
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  browser:
    name: PWA browser regression (${{ matrix.shard }}/4)
    needs: browser-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: '.node-version'
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Download regression fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwa-regression-builds
          path: dist/e2e
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vp exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: vp exec playwright install-deps chromium
      - name: Run production PWA regression
        run: vp exec playwright test --shard=${{ matrix.shard }}/4
      - name: Upload browser timing report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-regression-timings-${{ matrix.shard }}-${{ github.run_attempt }}
          path: dist/e2e/durations-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-regression-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            dist/e2e/report
            dist/e2e/results
          if-no-files-found: ignore

  complete:
    name: CI complete
    if: always()
    needs: [checks, build, browser-build, browser, native-changes, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks passed
        env:
          CHECKS: ${{ needs.checks.result }}
          BUILDS: ${{ needs.build.result }}
          FIXTURES: ${{ needs.browser-build.result }}
          BROWSER: ${{ needs.browser.result }}
          NATIVE_PATHS: ${{ needs.native-changes.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
          IOS_REQUIRED: ${{ needs.native-changes.outputs.ios }}
        run: |
          [[ "$CHECKS" == success && "$BUILDS" == success && "$FIXTURES" == success && "$BROWSER" == success ]] || exit 1
          [[ "$NATIVE_PATHS" == success && "$ANDROID" == success ]] || exit 1
          if [[ "$IOS_REQUIRED" == true ]]; then
            [[ "$IOS" == success ]]
          else
            [[ "$IOS_REQUIRED" == false && "$IOS" == skipped ]]
          fi
