name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run test

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CQUT
            command: vp run build:cqut
            license_path: apps/web/.vercel/output/static/licenses/third-party.json
          - name: CQUT offline
            command: vp run build:cqut-offline
            license_path: apps/web/.vercel/output/static/licenses/third-party.json
          - name: Default
            command: vp run build:default
            license_path: apps/web/.vercel/output/static/licenses/third-party.json
          - name: Mobile
            command: vp run build:mobile
            license_path: apps/web/build/licenses/third-party.json
          - name: GitHub Pages
            command: vp run build:pages
            license_path: apps/web/build/licenses/third-party.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      - run: ${{ matrix.command }}
      - run: test -s "${{ matrix.license_path }}"
      - run: vp run verify:official-plugins

  complete:
    name: CI complete
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
