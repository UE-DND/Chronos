name: Release CI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '正式版本标签（vX.Y.Z）；重试或回滚也必须选择标签'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      epoch: ${{ steps.source.outputs.epoch }}
    steps:
      - id: validate
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a release tag vX.Y.Z'; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.validate.outputs.tag }}
          fetch-depth: 0
      - id: source
        env:
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          git merge-base --is-ancestor HEAD refs/remotes/origin/master || {
            echo 'Release tags must point to a commit already merged into master.' >&2
            exit 1
          }
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('apps/web/package.json','utf8')).version")"
          [[ "$TAG" == "v$VERSION" ]] || { echo 'Tag and host version differ'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    needs: version
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.version.outputs.commit }}

  android-apk:
    needs: [version, quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [chronos-default, chronos-cqut, chronos-cqut-offline]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets.' >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chronos-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/chronos-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build Android APK for ${{ matrix.profile }}
        env:
          CHRONOS_DEPLOY_TARGET: mobile
          CHRONOS_DEPLOYMENT: mobile
          CHRONOS_DISTRIBUTION: mobile
          CHRONOS_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          vp run mobile:build
          cd apps/mobile/android
          ./gradlew --no-daemon assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$GITHUB_WORKSPACE/release-apks"
          cp "$APK" "$GITHUB_WORKSPACE/release-apks/Chronos-${CHRONOS_PROFILE}-${{ needs.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk-${{ matrix.profile }}
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [version, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      previous: ${{ steps.market.outputs.previous }}
    env:
      CHRONOS_DEPLOY_TARGET: pages
      CHRONOS_DISTRIBUTION: pages
      SOURCE_DATE_EPOCH: ${{ needs.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run build:pages
      - name: Load immutable plugin history
        run: |
          set +e
          git ls-remote --exit-code origin refs/heads/chronos/plugin-dist
          RESULT=$?
          set -e
          if [[ "$RESULT" == 0 ]]; then
            git fetch origin chronos/plugin-dist
            git worktree add --detach dist/plugin-history FETCH_HEAD
          elif [[ "$RESULT" == 2 ]]; then
            git worktree add --detach dist/plugin-history HEAD
            git -C dist/plugin-history switch --orphan chronos/plugin-dist
          else
            exit "$RESULT"
          fi
      - id: market
        name: Validate and assemble all published plugin versions
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: node --experimental-strip-types scripts/official-plugin-build/plugin-release.ts stage dist/plugin-market dist/plugin-history apps/web/build "$VERSION" "$COMMIT"
      - name: Save immutable plugin history
        run: |
          git -C dist/plugin-history add releases
          if ! git -C dist/plugin-history diff --cached --quiet; then
            git -C dist/plugin-history -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '📦 保存官方插件发布产物'
            git -C dist/plugin-history push origin HEAD:refs/heads/chronos/plugin-dist
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/build
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    needs: [version, build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          run-install: false
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.build.outputs.previous }}
        run: node --experimental-strip-types scripts/official-plugin-build/plugin-release.ts smoke https://ue-dnd.github.io/Chronos/plugins/releases/ "$VERSION" "$PREVIOUS"

  vercel:
    needs: [version, verify]
    uses: ./.github/workflows/vercel-production.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  publish-release:
    needs: [version, build, deploy, verify, vercel, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: android-apk-*
          path: release-apks
          merge-multiple: true
      - name: Create or update GitHub Release with Android APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" release-apks/*.apk --clobber
