name: iOS IPA

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build'
        required: true
        type: string
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: true
        type: string
      version:
        description: 'Release version (X.Y.Z)'
        required: true
        type: string
      profile:
        description: 'Chronos profile ID'
        required: true
        type: string
      name:
        description: 'Profile display name'
        required: true
        type: string
      epoch:
        description: 'SOURCE_DATE_EPOCH for reproducible web assets'
        required: true
        type: string
    secrets:
      GOOGLE_SERVICE_INFO_PLIST_BASE64:
        required: true

permissions:
  contents: read

jobs:
  ipa:
    name: Build ${{ inputs.name }} IPA
    runs-on: macos-latest
    env:
      CHRONOS_DEPLOY_TARGET: mobile
      CHRONOS_DEPLOYMENT: mobile
      CHRONOS_DISTRIBUTION: mobile
      CHRONOS_PROFILE: ${{ inputs.profile }}
      CHRONOS_ENABLE_ANALYTICS: 'true'
      PUBLIC_IOS_RELEASE_FEED_URL: https://ue-dnd.github.io/Chronos/ios/stable.json
      SOURCE_DATE_EPOCH: ${{ inputs.epoch }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Configure iOS Firebase
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]]; then
            echo 'Configure GOOGLE_SERVICE_INFO_PLIST_BASE64 repository secret.' >&2
            exit 1
          fi
          PLIST="apps/mobile/ios/App/App/GoogleService-Info.plist"
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -D > "$PLIST"
          plutil -lint "$PLIST"
          BUNDLE_ID="$(plutil -extract BUNDLE_ID raw -o - "$PLIST")"
          [[ "$BUNDLE_ID" == 'org.uednd.chronos' ]] || {
            echo "Firebase GoogleService-Info.plist registers $BUNDLE_ID instead of org.uednd.chronos" >&2
            exit 1
          }

      - name: Verify project version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PROJECT=apps/mobile/ios/App/App.xcodeproj/project.pbxproj
          MARKETING="$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' "$PROJECT" | sort -u)"
          BUILD="$(sed -n 's/.*CURRENT_PROJECT_VERSION = \(.*\);/\1/p' "$PROJECT" | sort -u)"
          EXPECTED_BUILD="$(node --experimental-strip-types scripts/versioning.ts "$VERSION")"
          [[ "$MARKETING" == "$VERSION" ]] || { echo "MARKETING_VERSION $MARKETING != $VERSION" >&2; exit 1; }
          [[ "$BUILD" == "$EXPECTED_BUILD" ]] || { echo "CURRENT_PROJECT_VERSION $BUILD != $EXPECTED_BUILD" >&2; exit 1; }

      - name: Build mobile web assets
        run: |
          vp run mobile:build
          # A cached build may skip the sync step; always refresh the iOS web assets.
          vp run mobile:sync

      - name: Reuse immutable IPA on retry
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PROFILE: ${{ inputs.profile }}
          COMMIT: ${{ inputs.ref }}
          REPOSITORY: ${{ github.repository }}
        run: node --experimental-strip-types scripts/official-plugin-build/ios-release.ts reuse release-ipas "$REPOSITORY" "$TAG" "$PROFILE" "$COMMIT"

      - name: Build unsigned IPA for ${{ inputs.name }}
        if: steps.reuse.outputs.reused != 'true'
        env:
          VERSION: ${{ inputs.version }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project apps/mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP="$DERIVED/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          test -s "$APP/GoogleService-Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")" == 'org.uednd.chronos'
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")" == "$VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Info.plist")" == "$(node --experimental-strip-types scripts/versioning.ts "$VERSION")"
          PAYLOAD="$RUNNER_TEMP/ipa/Payload"
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/App.app"
          FLAVOR="${PROFILE#chronos-}"
          BASE_NAME="Chronos-${FLAVOR}-${VERSION}"
          mkdir -p release-ipas
          IPA="$GITHUB_WORKSPACE/release-ipas/${BASE_NAME}.ipa"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$IPA" Payload)
          node --experimental-strip-types scripts/official-plugin-build/ios-release.ts inspect "$IPA" apps/web/build/version.json
          ls -lh release-ipas

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa-${{ inputs.profile }}
          path: release-ipas/*
          if-no-files-found: error
          retention-days: 7
