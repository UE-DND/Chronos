name: Deploy Vercel production

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Deploy tagged version to Vercel
        env:
          pnpm_config_strict_dep_builds: 'false'
          CHRONOS_DISTRIBUTION: cqut
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          vpx vercel@50.44.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          vpx vercel@50.44.0 build --prod --token="$VERCEL_TOKEN"
          vpx vercel@50.44.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
