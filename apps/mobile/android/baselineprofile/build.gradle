apply plugin: 'com.android.test'
apply plugin: 'androidx.baselineprofile'

android {
    namespace 'org.uednd.chronos.baselineprofile'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdk 28
        targetSdk rootProject.ext.targetSdkVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    targetProjectPath ':app'
}

// Use a connected API 33+ device/emulator (or a rooted API 28+ device).
// Ordinary Release builds consume checked-in profiles and never start a device.
baselineProfile {
    useConnectedDevices true
}

dependencies {
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.5.0'
    implementation "androidx.test.ext:junit:$androidxJunitVersion"
    implementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}
